name: Build V85 Production Patch

on:
  push:
    branches:
      - build/v85-split-wallet-transfer-fee-zip

jobs:
  package-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: catatan-keuangan-v85-split-wallet-transfer-fee
          if-no-files-found: error
          path: |
            legacy/ajax/features.php
            legacy/db.php
            legacy/finance_features.php
            repositories/FinanceRepository.php
            views/site/index.php
            web/assets/app.js
            web/sw.js
