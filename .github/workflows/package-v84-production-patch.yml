name: Build V84 Production Patch ZIP

on:
  push:
    branches:
      - build/v84-production-patch-zip

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Package production patch
        run: |
          mkdir -p patch
          cp legacy/ajax/dashboard.php patch/dashboard.php
          cp web/assets/app.js patch/app.js
          cp web/assets/currency-input.js patch/currency-input.js
          cp web/sw.js patch/sw.js
          cp views/site/index.php patch/index.php
          cat > patch/INSTALL.txt <<'EOF'
V84 Production Patch - Catatan Keuangan

Timpa file berikut pada production sesuai path asli:
1. patch/dashboard.php       -> legacy/ajax/dashboard.php
2. patch/app.js              -> web/assets/app.js
3. patch/currency-input.js   -> web/assets/currency-input.js
4. patch/sw.js               -> web/sw.js
5. patch/index.php           -> views/site/index.php

Setelah upload, refresh aplikasi. Bila Service Worker masih memakai cache lama,
hapus cache situs / reload sekali lagi.
EOF
          cd patch
          zip -r ../catatan-keuangan-v84-production-patch.zip .
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: catatan-keuangan-v84-production-patch
          path: catatan-keuangan-v84-production-patch.zip
          if-no-files-found: error
