name: Build V84 Production Patch

on:
  push:
    branches:
      - build/v84-notification-badge-zip

jobs:
  package-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package patch files
        uses: actions/upload-artifact@v4
        with:
          name: catatan-keuangan-v84-notification-badge
          if-no-files-found: error
          path: |
            legacy/ajax/dashboard.php
            web/assets/app.js
            web/sw.js
